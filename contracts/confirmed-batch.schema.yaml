$schema: https://json-schema.org/draft/2020-12/schema
$id: rainskills.confirmed-batch.v1.request
title: Confirmed configuration batch
type: object
additionalProperties: false
required: [schema, scope, steps]
properties:
  schema: {const: rainskills.confirmed-batch.v1.request}
  scope: {$ref: '#/$defs/scope'}
  steps:
    type: array
    minItems: 1
    maxItems: 32
    items:
      type: object
      additionalProperties: false
      required: [key, tool, arguments]
      properties:
        key: {type: string, minLength: 1, maxLength: 64, description: At most 64 UTF-8 bytes.}
        tool:
          enum: [rainbond_manage_component_envs, rainbond_manage_component_ports, rainbond_manage_component_connection_envs, rainbond_manage_component_dependency]
        arguments:
          type: object
          description: Validated against the live tool schema and the exact configuration-operation allowlist. Scope overrides are rejected. No delete or arbitrary result bindings.
$defs:
  scope:
    type: object
    additionalProperties: false
    required: [team_name, region_name, app_id]
    properties:
      team_name: {type: string, minLength: 1, maxLength: 128}
      region_name: {type: string, minLength: 1, maxLength: 128}
      app_id: {type: integer, minimum: 1}
  result:
    type: object
    required: [schema, status, completed, steps, blocker]
    properties:
      schema: {const: rainskills.confirmed-batch.v1.result}
      status: {enum: [succeeded, partial, failed, unknown]}
      completed: {type: integer, minimum: 0}
      steps: {type: array, maxItems: 32}
      blocker: {type: [object, 'null']}
