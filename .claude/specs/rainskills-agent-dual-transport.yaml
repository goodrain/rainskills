meta:
  name: "rainskills-agent-dual-transport"
  version: "1.0"
  repo: "multi:/Users/guox/Desktop/Project/rainskills,/Users/guox/Desktop/Project/rainbond-agent"
  branch: "rainskills:main; rainbond-agent:main-7.9"
  design_doc: "docs/plans/2026-08-13-cli-only-rainskills-and-agent-skill-coordination.md"
  invariants:
    - "CLI profile uses only the RainSkills API endpoint /console/mcp/rainskills/api/query."
    - "Agent embedded profile uses only session-provided Rainbond MCP tools backed by /console/mcp/query."
    - "Transport failures never fall back across the API/MCP boundary."
    - "CDN/cache/vendor fallback changes only the Skill content source, never the platform transport."

sprints:
  - id: sprint-1
    name: "Publish explicit CLI and MCP artifact contracts"
    commits:
      - id: commit-1
        repo: "/Users/guox/Desktop/Project/rainskills"
        message: "feat: publish explicit cli and embedded skill profiles"
        tasks: [task-1.1, task-1.2]
    tasks:
      - id: task-1.1
        name: "Make the embedded artifact contract explicitly MCP-only"
        status: completed
        files:
          modify:
            - path: "scripts/build-skill-profile.mjs"
              lines: "25-42,125-192,253-310"
            - path: "tests/skill-profile-builder.test.js"
              lines: "48-101"
        steps:
          - action: "write-test"
            description: "Change the manifest expectation from the ambiguous session_tools value to the canonical MCP transport and assert the generated narrative never mentions the CLI API endpoint."
            code: |
              assert.deepEqual(manifest.runtime_contract, {
                platform_transport: "mcp",
                endpoint_class: "rainbond_agent_mcp",
                client_workspace: "unavailable",
                local_package_upload: "unsupported",
                configuration_sources: ["explicit_input", "session_context", "platform_tools"],
                unavailable_behavior: "stop_and_report",
              });
              assert.doesNotMatch(content, /rainskills-tools\.js|\/console\/mcp\/rainskills\/api\/query/);
            run: "node --test tests/skill-profile-builder.test.js"
            expect: "FAIL because the generated manifest still uses session_tools and lacks endpoint_class"
          - action: "implement"
            description: "Emit the explicit MCP runtime contract while preserving the existing embedded narrative and forbidden-marker checks."
            code: |
              const EMBEDDED_RUNTIME_CONTRACT = {
                platform_transport: "mcp",
                endpoint_class: "rainbond_agent_mcp",
                client_workspace: "unavailable",
                local_package_upload: "unsupported",
                configuration_sources: ["explicit_input", "session_context", "platform_tools"],
                unavailable_behavior: "stop_and_report",
              };
            run: "node --test tests/skill-profile-builder.test.js"
            expect: "PASS"
        acceptance:
          - cmd: "node --test tests/skill-profile-builder.test.js"
            expect: "All embedded profile tests pass"
        references:
          - path: "docs/plans/2026-08-13-cli-only-rainskills-and-agent-skill-coordination.md:123-143"
            note: "Canonical CLI/API and Agent/MCP separation"

      - id: task-1.2
        name: "Publish profile and transport metadata in both channel families"
        status: completed
        files:
          modify:
            - path: ".github/workflows/release.yml"
              lines: "82-104,293-319"
            - path: "tests/skill-profile-builder.test.js"
              lines: "120-134"
        steps:
          - action: "write-test"
            description: "Require CLI manifests to identify profile=cli/transport=api and embedded manifests to identify profile=embedded/transport=mcp."
            code: |
              assert.match(workflow, /"profile": "cli"[\s\S]*"transport": "api"/);
              assert.match(workflow, /"profile": "embedded"[\s\S]*"transport": "mcp"/);
            run: "node --test tests/skill-profile-builder.test.js"
            expect: "FAIL because the release manifests do not yet carry both explicit transport values"
          - action: "implement"
            description: "Add profile and transport fields to canary/stable manifests without changing the existing URLs or npm promotion behavior."
            code: |
              // CLI channel manifest fields
              "profile": "cli",
              "transport": "api",
              // Embedded channel manifest fields
              "profile": "embedded",
              "transport": "mcp",
            run: "node --test tests/skill-profile-builder.test.js"
            expect: "PASS"
        acceptance:
          - cmd: "npm test"
            expect: "PASS"
        references:
          - path: ".github/workflows/release.yml:34-172"
            note: "Canary artifact publication"
          - path: ".github/workflows/release.yml:293-356"
            note: "Stable channel promotion"

  - id: sprint-2
    name: "Make rainbond-agent consume only embedded MCP artifacts"
    commits:
      - id: commit-2
