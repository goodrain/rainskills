        message: "refactor: generate embedded skill vendor fallback"
        tasks: [task-3.1, task-3.2]
    tasks:
      - id: task-3.1
        name: "Replace rsync-and-reinject with the upstream embedded builder"
        status: pending
        files:
          modify:
            - path: "scripts/sync-rainbond-skills.mjs"
              lines: "1-189"
            - path: "scripts/sync-skills.sh"
              lines: "1-118"
          create:
            - path: "tests/server/skills/sync-rainbond-skills.test.ts"
        steps:
          - action: "write-test"
            description: "Create a fake upstream builder, set RAINBOND_SKILLS_UPSTREAM, and assert the sync command installs only a validated embedded artifact with its source revision."
            code: |
              const result = spawnSync(process.execPath, [syncScript], {
                env: { ...process.env, RAINBOND_SKILLS_UPSTREAM: upstream },
                encoding: "utf8",
              });
              expect(result.status).toBe(0);
              expect(readVendorManifest()).toMatchObject({
                profile: "embedded",
                runtime_contract: { platform_transport: "mcp" },
              });
            run: "npx vitest run tests/server/skills/sync-rainbond-skills.test.ts"
            expect: "FAIL because the current script ignores RAINBOND_SKILLS_UPSTREAM and performs raw rsync"
          - action: "implement"
            description: "Resolve the explicit upstream, invoke its build-skill-profile.mjs into a temporary directory, validate the manifest, then atomically rsync the complete embedded tree into skills-src/rainbond. Make sync-skills.sh delegate to this one path."
            code: |
              const sourceRoot = process.env.RAINBOND_SKILLS_UPSTREAM
                ? resolve(process.env.RAINBOND_SKILLS_UPSTREAM)
                : resolve(projectRoot, "..", "rainskills");
              execFileSync(process.execPath, [
                join(sourceRoot, "scripts", "build-skill-profile.mjs"),
                "--profile", "embedded",
                "--source-root", sourceRoot,
                "--revision", upstreamRevision,
                "--output", stagingRoot,
              ]);
              // validate manifest, then rsync stagingRoot/ to skills-src/rainbond/
            run: "npx vitest run tests/server/skills/sync-rainbond-skills.test.ts"
            expect: "PASS"
        acceptance:
