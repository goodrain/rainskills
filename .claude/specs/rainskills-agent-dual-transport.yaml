              lines: "33-57,88-143,218-276,334-367"
            - path: "tests/server/skills/skill-source.test.ts"
              lines: "51-96,140-452,455-523"
        steps:
          - action: "write-test"
            description: "Update the fake CDN to expose embedded manifests and assert the resolver uses manifest.tarball_url rather than the legacy hard-coded URL."
            code: |
              const manifestPath = `/profiles/embedded/channels/${channel}.json`;
              const tarballPath = `/profiles/embedded/rainskills-embedded-${sha}.tar.gz`;
              expect(cdn.hits).toContain(manifestPath);
              expect(cdn.hits).toContain(tarballPath);
              expect(result.profile).toBe("embedded");
            run: "npx vitest run tests/server/skills/skill-source.test.ts"
            expect: "FAIL against the legacy /channels and /rainskills-<sha> paths"
          - action: "implement"
            description: "Add the embedded profile to source types, fetch the embedded channel, validate same-origin tarball URLs, and reject profile/transport mismatches."
            code: |
              const SKILL_PROFILE = "embedded" as const;
              const PLATFORM_TRANSPORT = "mcp" as const;
              interface ChannelManifest {
                sha: string;
                profile: typeof SKILL_PROFILE;
                transport: typeof PLATFORM_TRANSPORT;
                tarball_url: string;
                manifest_version: number;
              }
              const channelUrl = `${baseUrl}/profiles/${SKILL_PROFILE}/channels/${channel}.json`;
              // Parse tarball_url with URL, require the configured CDN origin, then download it verbatim.
            run: "npx vitest run tests/server/skills/skill-source.test.ts"
            expect: "PASS"
        acceptance:
          - cmd: "npx vitest run tests/server/skills/skill-source.test.ts"
            expect: "All source-resolution tests pass"
        references:
          - path: "src/server/skills/skill-source.ts:218-276"
            note: "Legacy channel and tarball resolution to replace"

      - id: task-2.2
        name: "Isolate cache by embedded profile and validate the extracted artifact manifest"
        status: pending
        files:
          modify:
            - path: "src/server/skills/skill-source.ts"
              lines: "13-31,236-318,370-420"
            - path: "tests/server/skills/skill-source.test.ts"
              lines: "140-452"
        steps:
          - action: "write-test"
            description: "Require cache paths under embedded/<sha>, a profile manifest, matching source revision, and runtime_contract.platform_transport=mcp."
            code: |
              expect(result.rootDir).toBe(path.join(cacheDir, "embedded", sha));
              await expect(resolveWithMissingProfileManifest()).rejects.toThrow(/profile manifest/i);
              await expect(resolveWithCliProfile()).rejects.toThrow(/profile.*embedded/i);
              await expect(resolveWithApiTransport()).rejects.toThrow(/transport.*mcp/i);
            run: "npx vitest run tests/server/skills/skill-source.test.ts"
            expect: "FAIL before cache and manifest validation are profile-aware"
          - action: "implement"
            description: "Move LATEST and SHA directories under the embedded cache namespace and validate rainskills-profile.json before promoting a download into cache."
            code: |
              interface EmbeddedProfileManifest {
                manifest_version: number;
                profile: "embedded";
                source_revision: string;
                runtime_contract: { platform_transport: "mcp" };
              }
              const profileCacheDir = path.join(cacheDir, "embedded");
              // validate profile, transport, revision, and required skills before atomic rename
            run: "npx vitest run tests/server/skills/skill-source.test.ts"
            expect: "PASS"
        acceptance:
          - cmd: "npx vitest run tests/server/skills/skill-source.test.ts tests/server/skills/skill-registry-source.integration.test.ts"
            expect: "PASS"
        references:
          - path: "src/server/skills/skill-source.ts:278-318"
            note: "Legacy cache fallback and LATEST handling"

      - id: task-2.3
        name: "Expose embedded profile identity through registry and admin status"
        status: pending
        files:
          modify:
            - path: "src/server/skills/skill-registry.ts"
              lines: "30-42,83-128"
            - path: "src/server/admin/skills-admin.ts"
              lines: "124-131"
            - path: "tests/server/skills/skill-registry-source.integration.test.ts"
              lines: "52-137"
            - path: "tests/server/admin/skills-admin.test.ts"
              lines: "1-170"
        steps:
          - action: "write-test"
            description: "Require profile=embedded in registry source metadata and admin version/reload responses."
            code: |
              expect(getCurrentSkillSource().profile).toBe("embedded");
              expect(payload.profile).toBe("embedded");
            run: "npx vitest run tests/server/skills/skill-registry-source.integration.test.ts tests/server/admin/skills-admin.test.ts"
            expect: "FAIL because ResolvedSkillSource has no profile field"
          - action: "implement"
            description: "Carry profile identity through local/CDN/fallback results and admin serialization without changing the MCP executor."
            code: |
              export interface ResolvedSkillSource {
                profile: "embedded";
                rootDir: string;
                sha: string;
                channel: string;
                source: ResolvedSkillSourceKind;
              }
            run: "npx vitest run tests/server/skills/skill-registry-source.integration.test.ts tests/server/admin/skills-admin.test.ts"
            expect: "PASS"
        acceptance:
