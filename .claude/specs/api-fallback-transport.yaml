rollout:
  order:
    - "Release rainbond-console first."
    - "Verify existing Codex and Claude MCP paths."
    - "Release rainskills with the bridge and policy."
    - "Canary API fallback on a client without loaded MCP."
    - "Expand after telemetry and failure review."
  observe:
    - "api invocation count"
    - "401 and 403 rate"
    - "dedicated endpoint 404 rate"
    - "timeouts and unknown write outcomes"
    - "tool business-error rate"
  rollback:
    - "Rollback rainskills first so skills stop selecting API."
    - "Keep the execution-time hidden-tool guard unless a separate security review approves its rollback."
    - "No database or catalog data rollback is required."

definition_of_done:
  - "MCP-present workflows make no bridge call."
  - "API workflows do not inject the full catalog into persistent context."
  - "Tool additions, schema changes, and deletions are visible on the next list/describe."
  - "Catalog and execution have no second source of truth."
  - "No write automatically retries through another transport."
  - "API and MCP share the same server-side authorization."
  - "Old/new compatibility behavior is automated and documented."
  - "Both repositories pass their full verification gates."
