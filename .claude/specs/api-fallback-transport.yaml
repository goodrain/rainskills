meta:
  name: api-fallback-transport
  version: "1.0"
  status: design-review
  implementation_started: false
  repo: "/Users/guox/Desktop/Project/rainskills + /Users/guox/Desktop/Project/rainbond-console"
  branch: "codex/api-fallback-transport"
  design_doc: "docs/plans/2026-08-12-api-fallback-transport-design.md"
  skill_contract: "docs/plans/2026-08-13-skill-transport-contract.md"

scope:
  in:
    - "Use native MCP when the current session exposes the required rainbond_* tool."
    - "Use a local stateless Node bridge when MCP is unavailable but local command execution exists."
    - "Reuse MCPQueryService as the sole catalog, executor, permission boundary, and error contract."
    - "Discover schemas on demand and install one stable bridge on POSIX and Windows."
    - "Enforce Rainskills hidden-tool policy at execution time."
  out:
    - "A REST endpoint per Rainbond tool."
    - "A local catalog cache, capability-id registry, catalog push, or database migration."
    - "Automatic cross-transport failover or retry of writes."
    - "Universal support for clients without MCP, local commands, or HTTP-function support."
    - "JWT scope, audience, or all-client authentication migration."

decisions:
  catalog: "rainbond-console MCPQueryService.list_tools only"
  executor: "rainbond-console MCPQueryService.call_tool only"
  api_protocol: "Existing authenticated stateless MCP HTTP JSON-RPC"
  api_endpoint: "/console/mcp/rainskills/api/query"
  api_invocation: {deploy_origin: rainskills, deploy_client: api}
  bridge_path_posix: "$HOME/.rainbond/bin/rainskills-tools.js"
  bridge_path_windows: "%USERPROFILE%\\.rainbond\\bin\\rainskills-tools.js"
  selection: "If the session exposes any rainbond_* tool, select MCP; only a session with zero Rainbond tools may probe API; lock once for the workflow"
  retry: "Never change transport after an authentication, network, timeout, protocol, or business error"
  catalog_cache: "None; cache at most one schema in the active agent context"
  compatibility: "Dedicated endpoint 404 means Console upgrade required; no generic endpoint fallback"
  bridge_timeout_ms: 180000
  compact_list_shape: "Tool name strings only; description and inputSchema are describe-only"
  default_install_semantics: "Preserve current MCP registration and verification failure behavior"
  api_install_semantics: "Explicit --api-only reuses codex|claude|all|--dest targeting, installs skills and bridge, authorizes, validates the API endpoint, and does not edit MCP client configuration"
  skip_mcp_semantics: "Preserve historical skill-copy-only behavior; it is not API-only mode"
  shared_skill_policy: "Maintain one policy under rainbond-app-assistant and rely on the existing official full-suite installation contract; do not add generated copies"

protocol_contract:
  headers:
    Authorization: "GRJWT <jwt>"
    Content-Type: "application/json"
    Accept: "application/json"
    MCP-Protocol-Version: "2025-03-26"
  methods:
    - name: tools/list
      params: {}
      result: "result.tools"
    - name: tools/call
      params: {name: "string", arguments: "object"}
      result: "result.structuredContent"
  cli:
    - "status"
    - "list [--prefix <prefix>]"
    - "describe <tool-name>"
    - "call <tool-name> --input <json-file|->"
  output:
    status: "status and tool_count only"
    list: "tool name strings only"
    describe: "one tool name, description, and inputSchema"
    call: "structuredContent only"
  exit_codes:
    0: success
    2: cli_or_input_error
    3: configuration_or_authentication_error
    4: network_timeout_endpoint_or_protocol_error
    5: tool_not_found_validation_or_business_error
  secret_rules:
    - "No --token argument."
    - "Read only RAINBOND_URL and RAINBOND_JWT from the process environment or managed mcp.env."
    - "Never execute mcp.env as shell code."
    - "Never print Authorization, JWT, or complete tool arguments."

quality_gates:
  console_related: "pytest console/tests/mcp_deployment_invocation_test.py console/tests/mcp_query_view_test.py console/tests/mcp_query_service_test.py console/tests/mcp_query_error_contract_test.py -q"
  console_full: "make format && make check && pytest"
  rainskills_related: "node --test tests/api-bridge.test.js tests/npx-launcher.test.js tests/transport-resolution.test.js"
  rainskills_full: "npm test"
  compatibility: "Run the check-api-compat checklist for endpoint, headers, methods, arguments, structuredContent, errors, and invocation marker."

