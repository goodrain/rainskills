        steps:
          - action: "write-test"
            description: "Reject malformed metadata and prove every RainSkills-visible tool has one classification."
            code: |
              self.assertEqual(validate_operation_meta(valid_meta)["operation_id"], operation_id)
              with self.assertRaises(ServiceHandleException):
                  validate_operation_meta({**valid_meta, "operation_id": "bad"})
              names = {item["name"] for item in mcp_query_service.list_tools(admin)}
              self.assertEqual(names, READ_ONLY_TOOL_NAMES | set(MUTABLE_TOOL_POLICY))
              self.assertFalse(READ_ONLY_TOOL_NAMES & set(MUTABLE_TOOL_POLICY))
            run: "pytest -q console/tests/rainskills_audit_contract_test.py console/tests/rainskills_tool_audit_policy_test.py"
            expect: "FAIL before contract and policy exist"
          - action: "implement"
            description: "Add strict metadata schema, size limits, explicit policy, and unknown-tool write fallback."
            code: |
              @dataclass(frozen=True)
              class ToolAuditSpec:
                  operation_class: str
                  risk: str
                  scope: str

              def classify_tool(tool_name: str) -> ToolAuditSpec:
                  if tool_name in READ_ONLY_TOOL_NAMES:
                      return ToolAuditSpec("read", "none", "enterprise")
                  return MUTABLE_TOOL_POLICY.get(
                      tool_name, ToolAuditSpec("write", "medium", "enterprise")
                  )
            run: "pytest -q console/tests/rainskills_audit_contract_test.py console/tests/rainskills_tool_audit_policy_test.py"
            expect: "PASS"
        acceptance:
          - cmd: "pytest -q console/tests/rainskills_audit_contract_test.py console/tests/rainskills_tool_audit_policy_test.py"
            expect: "PASS"
