        steps:
          - action: "write-test"
            description: "Reject proxy/global tokens and isolate event/snapshot reads by the enterprise-bound token."
            code: |
              request.META["HTTP_X_INTERNAL_TOKEN"] = enterprise.enterprise_id
              response = view.get(request)
              self.assertEqual(response.status_code, 200)
              request.META["HTTP_X_INTERNAL_TOKEN"] = settings.INTERNAL_API_TOKEN
              self.assertEqual(view.get(request).status_code, 401)
            run: "pytest -q console/tests/internal_rainskills_audit_view_test.py"
            expect: "FAIL before enterprise-bound auth and views exist"
          - action: "implement"
            description: "Reuse cluster-internal checks but bind request.audit_enterprise_id only from a TenantEnterprise token."
            code: |
              class EnterpriseBoundAgentRuntimeAuthentication(AgentRuntimeAuthentication):
                  def authenticate(self, request):
                      token = request.META.get("HTTP_X_INTERNAL_TOKEN")
                      if not token or not self._is_cluster_internal(request):
                          return None
                      enterprise = TenantEnterprise.objects.filter(enterprise_id=token).first()
                      if not enterprise:
                          raise exceptions.AuthenticationFailed("enterprise-bound token required")
                      request.audit_enterprise_id = token
                      return super().authenticate(request)
            run: "pytest -q console/tests/internal_rainskills_audit_view_test.py"
            expect: "PASS"
