meta:
  name: "windows-platform-convergence"
  version: "1.0"
  repo: "/Users/goodrain/Desktop/code/rainskills"
  branch: "main"
  design_doc: "docs/superpowers/specs/2026-08-05-windows-platform-convergence-design.md"
  constraints:
    - "Only local-windows behavior may change; local-macos, local-linux, and remote-linux must remain unchanged."
    - "Reuse the existing Rainbond WSL distro, installation_id, network, containers, and data when ownership is valid."
    - "Runtime network repair must never stop or restart Docker or the rainbond container."
    - "Do not run the Rainbond installer while converging an existing platform."
    - "Do not stage or commit the two forbidden untracked docs/superpowers/plans files."

sprints:
  - id: sprint-1
    name: "Converge legacy Windows installations"
    commits:
      - id: commit-1
        message: "fix: converge existing Windows platforms safely"
        tasks: [task-1.1, task-1.2]
    tasks:
      - id: task-1.1
        name: "Version and refresh the complete Windows recovery bundle"
        status: completed
        files:
          modify:
            - path: "rainbond-platform-installer/scripts/platform-installer.js"
              lines: "1477-1577"
            - path: "rainbond-platform-installer/scripts/windows-platform.js"
              lines: "296-364, 890-1042"
            - path: "rainbond-platform-installer/scripts/windows-platform.ps1"
              lines: "521-600, 1246-1370"
            - path: "tests/platform-installer.test.js"
              lines: "144-262"
            - path: "tests/windows-platform.test.js"
              lines: "441-517, 761-794"
        steps:
          - action: "write-test"
            description: "Add failing tests proving an rc.40 recovery-v1 bundle is not reused by a newer package and every machine payload compares helper, bootstrap, recovery manifest, and package version."
            code: |
              test("Windows recovery bundle is versioned by the current package", () => {
                const first = windowsRecoveryBundle(paths, { packageRoot: rc40Root, packageVersion: "0.1.0-rc.40" });
                const next = windowsRecoveryBundle(paths, { packageRoot: rc41Root, packageVersion: "0.1.0-rc.41" });
                assert.notEqual(next.bundleRoot, first.bundleRoot);
                assert.equal(next.manifest.package_version, "0.1.0-rc.41");
              });
            run: "node --test tests/platform-installer.test.js tests/windows-platform.test.js"
            expect: "FAIL before implementation because recovery-v1 is reused and package version is absent"
          - action: "implement"
            description: "Create recovery-v2/<package-version> bundles, verify their package version, include package_version and recovery manifest digest in state/currentness checks, and persist them in the machine manifest. Preserve verification support for legacy v1 bundles only as upgrade sources."
            code: |
              function windowsRecoveryBundle(paths, options = {}) {
                const packageRoot = options.packageRoot || path.resolve(__dirname, "..", "..");
                const packageVersion = options.packageVersion || packageManifest.version;
                const safeVersion = packageVersion.replace(/[^A-Za-z0-9._-]/g, "_");
                const bundleRoot = path.join(paths.root, "recovery-v2", safeVersion);
                if (fs.existsSync(path.join(bundleRoot, "manifest.json"))) {
                  const verification = verifyRecoveryBundle(bundleRoot);
                  if (verification.manifest.package_version !== packageVersion) {
                    throw new Error("Windows recovery bundle package version mismatch");
                  }
                  return { packageRoot, bundleRoot, manifest: verification.manifest };
                }
                const manifest = createRecoveryBundle({ packageRoot, bundleRoot, packageVersion, requiredFiles, requiredDirectories });
                return { packageRoot, bundleRoot, manifest };
              }
            run: "node --test tests/platform-installer.test.js tests/windows-platform.test.js"
            expect: "PASS"
          - action: "refactor"
            description: "Keep legacy v1 verification isolated from current bundle creation and ensure no cache path or executable command is accepted from helper output."
            run: "npm run test:platform && npm run test:windows"
            expect: "PASS"
        acceptance:
          - cmd: "npm run test:platform"
            expect: "all platform installer tests pass"
          - cmd: "npm run test:windows"
            expect: "all Windows Node tests pass; PowerShell parse remains CI-covered"
        references:
          - path: "rainbond-platform-installer/scripts/platform-installer.js:1477-1577"
            note: "Current recovery-v1 reuse and helper-only refresh logic"
          - path: "rainbond-platform-installer/scripts/windows-platform.js:296-364"
            note: "Recovery bundle creation and verification"
          - path: "rainbond-platform-installer/scripts/windows-platform.ps1:521-600"
            note: "Protected machine bundle installation and manifest"

      - id: task-1.2
        name: "Add an idempotent installed-platform convergence action"
        status: completed
        files:
          modify:
            - path: "rainbond-platform-installer/scripts/windows-platform.js"
              lines: "13-37, 890-1042"
            - path: "rainbond-platform-installer/scripts/windows-platform.ps1"
              lines: "1-10, 712-748, 949-1218, 1400-1585"
            - path: "rainbond-platform-installer/scripts/wsl-bootstrap.sh"
              lines: "44-50, 120-259, 280-426"
            - path: "tests/windows-platform.test.js"
              lines: "394-517, 1280-1426"
            - path: "tests/windows-contract.ps1"
              lines: "1-218"
        steps:
          - action: "write-test"
            description: "Add failing contracts for ConvergeInstalledPlatform and ConvergeInstalledRainbond. Assert the runtime path cannot invoke the Rainbond installer, docker restart/stop, or restart rainskills-network-ready; assert Docker unit drop-ins use Wants/After instead of Requires."
            code: |
              assert.match(powershell, /ConvergeInstalledPlatform/);
              assert.match(bootstrap, /ConvergeInstalledRainbond/);
              assert.doesNotMatch(convergeBlock, /InstallRainbond|installer_path/);
              assert.doesNotMatch(convergeBootstrap, /systemctl (?:restart|stop) docker|docker rm rainbond/);
              assert.match(dockerDropIn, /Wants=rainskills-network-ready\.service/);
              assert.doesNotMatch(dockerDropIn, /Requires=rainskills-network-ready\.service/);
            run: "node --test tests/windows-platform.test.js"
            expect: "FAIL because no installed-platform convergence action exists and Docker still Requires network-ready"
          - action: "implement"
            description: "Add fixed ConvergeInstalledPlatform to the Node allowlist/adapter and PowerShell dispatch. It must upgrade the bundle, rewrite current network helper/unit contracts, reconcile the owned fixed address/portproxy/tasks, start Docker only if stopped, docker start an owned stopped rainbond container, and verify deployment without importing the distro or running the installer."
            code: |
              function Invoke-ConvergeInstalledPlatform($Request) {
                $bundle = Invoke-InstallMachineBundle $Request
                $network = Invoke-ConfigureNetwork $Request
                Invoke-DistroBootstrap $Request "ConvergeInstalledRainbond" `
                  ([string]$network.hostAddress) ([string]$network.guestAddress)
                $verified = Invoke-VerifyDeployment $Request
                return [ordered]@{
                  machineBundleVerified = [bool]$bundle.machineBundleVerified
                  networkManifestVerified = [bool]$network.networkManifestVerified
                  portproxyVerified = [bool]$network.portproxyVerified
                  containerRunning = [bool]$verified.containerRunning
                  nodeReady = [bool]$verified.nodeReady
                  componentsReady = [bool]$verified.componentsReady
                  wslConsoleReachable = [bool]$verified.wslConsoleReachable
                  windowsConsoleReachable = [bool]$verified.windowsConsoleReachable
                  containerStartedAt = [string]$verified.containerStartedAt
                  guestAddress = [string]$verified.guestAddress
                }
              }
            run: "node --test tests/windows-platform.test.js"
            expect: "PASS"
          - action: "implement"
            description: "Make ConfigureGuestNetwork rewrite the current helpers and systemd units before in-place restore. Use Wants+After for Docker/containerd boot ordering so stopping network-ready cannot stop Docker. Add ConvergeInstalledRainbond that starts stopped services/owned container but performs no destructive rebuild."
            code: |
              converge_installed_rainbond() {
                assert_identity
                [[ -f "$NETWORK_READY_FILE" ]] || { printf 'Managed network is not ready\n' >&2; exit 1; }
                timeout 60 systemctl start docker
                docker info >/dev/null
                [[ -f "$STATE_DIR/rainbond-installation-id" ]] || { printf 'Rainbond ownership marker is missing\n' >&2; exit 1; }
                [[ "$(tr -d '\r\n' < "$STATE_DIR/rainbond-installation-id")" == "$INSTALLATION_ID" ]] || { printf 'Rainbond ownership marker mismatch\n' >&2; exit 1; }
                docker inspect rainbond >/dev/null 2>&1 || { printf 'Owned Rainbond container is missing\n' >&2; exit 1; }
                [[ "$(docker inspect rainbond --format '{{.State.Status}}')" == "running" ]] || docker start rainbond >/dev/null
              }
            run: "npm run test:windows"
            expect: "PASS"
          - action: "verify"
            description: "Run source contracts proving local macOS/Linux and remote branches were not changed."
            run: "npm run test:platform && npm run test:windows"
            expect: "PASS"
        acceptance:
          - cmd: "rg -n 'Requires=rainskills-network-ready.service|systemctl restart rainskills-network-ready' rainbond-platform-installer/scripts/wsl-bootstrap.sh"
            expect: "no output"
          - cmd: "npm run test:windows"
            expect: "all Windows tests pass"
        references:
          - path: "rainbond-platform-installer/scripts/wsl-bootstrap.sh:194-258"
            note: "Current strong systemd coupling and runtime restore"
          - path: "rainbond-platform-installer/scripts/windows-platform.ps1:1019-1218"
            note: "Current network reconcile and deployment verification"

  - id: sprint-2
    name: "Gate authorization on stable readiness"
    commits:
      - id: commit-2
        message: "fix: verify Windows stability before authorization"
        tasks: [task-2.1]
    tasks:
      - id: task-2.1
        name: "Converge and stabilize every Windows authorization entry"
        status: completed
        files:
          modify:
            - path: "rainbond-platform-installer/scripts/platform-installer.js"
              lines: "1538-1577, 1806-1947, 2380-2430"
            - path: "rainbond-platform-installer/scripts/windows-platform.js"
              lines: "733-767, 847-888"
            - path: "rainbond-platform-installer/scripts/windows-platform.ps1"
              lines: "1140-1218, 1400-1585"
            - path: "tests/platform-installer.test.js"
              lines: "187-262, 1120-1245"
            - path: "tests/windows-platform.test.js"
              lines: "1368-1426"
            - path: "docs/windows-local-install-acceptance.md"
              lines: "1-EOF"
            - path: "package.json"
              lines: "1-6"
            - path: "package-lock.json"
              lines: "1-20"
            - path: "marketplace/rainskills/.claude-plugin/plugin.json"
              lines: "1-20"
            - path: "marketplace/rainskills/.codex-plugin/plugin.json"
              lines: "1-20"
            - path: "marketplace/rainskills/skills/rainskills/SKILL.md"
              lines: "1-20"
        steps:
          - action: "write-test"
            description: "Replace helper-only resume tests with failing convergence tests. Prove platform-ready/authorizing local-windows calls convergence before changing onboarding stage or spawning authorization; non-Windows resume does not call it."
            code: |
              const converged = await convergeWindowsPlatformBeforeAuthorization(input);
              assert.equal(adapterCalls[0].method, "convergeInstalledPlatform");
              assert.equal(writes[0].values.stable_probe_count, 3);
              assert.equal(writes[0].values.device_flow_http_reachable, true);
              assert(convergeIndex < authorizingIndex && authorizingIndex < spawnIndex);
            run: "node --test tests/platform-installer.test.js"
            expect: "FAIL because resume only refreshes helper hashes"
          - action: "implement"
            description: "Implement ensureWindowsPlatformConverged and call it from runResume for every local-windows platform-ready/authorizing path. Use the current recovery payload plus the persisted managed subnet/addresses. Persist returned facts as context, never as a future skip condition."
            code: |
              async function ensureWindowsPlatformConverged({ adapter, onboarding, operationId, paths, state }) {
                const recovery = windowsRecoveryBundle(paths);
                const payload = {
                  ...buildWindowsMachineBundlePayload({ recovery, onboarding }),
                  subnet: state.windows_subnet || state.managed_subnet,
                  host_address: state.host_address,
                  guest_address: state.guest_address,
                };
                const result = await adapter.convergeInstalledPlatform({
                  operationId,
                  installationId: state.installation_id,
                  payload,
                });
                const delivery = evaluateWindowsDeployment({
                  ...result.facts,
                  expectedInstallationId: state.installation_id,
                  controlMode: onboarding.control_mode || "windows-native",
                }, POLICY);
                if (!delivery.ok) throw windowsConvergenceError(result.facts, delivery.blockers);
                return updateState(paths.state, state, convergenceStateValues(result.facts, payload));
              }
            run: "node --test tests/platform-installer.test.js"
            expect: "PASS"
          - action: "write-test"
            description: "Add failing stability contracts: three 5-second probes with unchanged StartedAt pass; a changed baseline retries at most three rounds/120 seconds; invalid Device Flow response fails with CONSOLE_DEVICE_FLOW_UNAVAILABLE; persistent changes fail with RAINBOND_RUNTIME_UNSTABLE."
            code: |
              assert.equal(facts.stableProbeCount, 3);
              assert.equal(facts.deviceFlowHttpReachable, true);
              assert.equal(facts.containerStartedAt, baseline);
              assert.equal(unstableError.code, "RAINBOND_RUNTIME_UNSTABLE");
              assert.equal(deviceError.code, "CONSOLE_DEVICE_FLOW_UNAVAILABLE");
            run: "node --test tests/windows-platform.test.js tests/platform-installer.test.js"
            expect: "FAIL before bounded stability and Device Flow validation exist"
          - action: "implement"
            description: "Inside the single elevated convergence action, run at most three stability rounds. Each round performs three deployment probes 5 seconds apart and requires identical non-empty containerStartedAt. Enforce a 120-second deadline. After a stable round, POST Device Flow once and require 2xx JSON with non-empty device_code, valid user_code, and positive integer expires_in/interval. Never persist or print returned codes. Return only booleans/counts/timestamps."
            code: |
              for ($round = 1; $round -le 3; $round++) {
                $samples = @()
                for ($probe = 1; $probe -le 3; $probe++) {
                  $samples += Invoke-VerifyDeployment $Request
                  if ($probe -lt 3) { Start-Sleep -Seconds 5 }
                }
                $startedAt = @($samples | ForEach-Object { $_.containerStartedAt } | Select-Object -Unique)
                if ($startedAt.Count -eq 1 -and -not [string]::IsNullOrWhiteSpace([string]$startedAt[0])) { break }
                if ($round -eq 3) { throw "RAINBOND_RUNTIME_UNSTABLE: Rainbond container restarted during the stability window" }
              }
              # Use Invoke-WebRequest POST once; require 2xx and validate only the
              # response shape. Never return or log device_code/user_code.
            run: "npm run test:platform && npm run test:windows"
            expect: "PASS"
          - action: "implement"
            description: "After a standalone resume succeeds, call Finalize so stale one-time recovery tasks are removed. Preserve tasks when authorization fails. Include stable failure code/layer in the surfaced error instead of bare fetch failed."
            run: "node --test tests/platform-installer.test.js tests/windows-platform.test.js"
            expect: "PASS"
          - action: "document"
            description: "Update Windows acceptance commands for existing-install migration, stable StartedAt, Device Flow, task contract, and explicit reinstall_required diagnostics. Bump package and marketplace versions to 0.1.0-rc.41."
            run: "npm run check:marketplace && npm run check:pi"
            expect: "PASS"
          - action: "verify"
            description: "Run complete repository validation before commit."
            run: "npm test"
            expect: "PASS (PowerShell parse may be skipped on macOS and must pass GitHub Windows CI after push)"
        acceptance:
          - cmd: "npm test"
            expect: "all local tests pass"
          - cmd: "npm pack --dry-run"
            expect: "package contains current Windows helper/bootstrap and version 0.1.0-rc.41"
          - cmd: "npm publish --dry-run --access public --tag next"
            expect: "dry run succeeds; no real publish is performed"
        references:
          - path: "rainbond-platform-installer/scripts/platform-installer.js:1866-1947"
            note: "Current authorization resume bypasses platform convergence"
          - path: "rainbond-platform-installer/scripts/windows-platform.ps1:1181-1218"
            note: "Current one-shot deployment verification"
          - path: "rainbond-platform-installer/scripts/windows-auth.js:173-206"
            note: "Authoritative Device Flow success and response-shape contract"
