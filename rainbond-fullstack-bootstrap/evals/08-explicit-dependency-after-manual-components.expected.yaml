case: explicit-dependency-after-manual-components
presentation_mode: structured
in_scope_components:
  - proxy
  - backend
  - db
assert:
  equal:
    BootstrapResult.deployment_plan.workflow.created:
      - db
      - backend
      - proxy
    BootstrapResult.deployment_plan.workflow.reused: []
    BootstrapResult.deployment_plan.workflow.skipped: []
    BootstrapResult.deployment_plan.workflow.skipped_reasons: {}
    BootstrapResult.deployment_plan.workflow.deferred_dependencies: []
    BootstrapResult.deployment_plan.workflow.frontend_access_mode: reverse-proxy
    BootstrapResult.runtime_state.overall: runtime_healthy
    BootstrapResult.runtime_state.blocking_bucket: null
    BootstrapResult.next_handoff: delivery_verifier
  contains:
    BootstrapResult.runtime_state.component_status:
      db: running
      backend: running
      proxy: running
  prose_contains:
    - manual component path
    - rainbond_manage_component_dependency
    - backend -> db
    - proxy -> backend
    - not treated as a substitute for console-visible dependency edges
