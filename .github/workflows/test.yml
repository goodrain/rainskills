name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RAINSKILLS_TELEMETRY_DISABLED: '1'
  RAINSKILLS_PACKAGE_VERSION: 'test'

jobs:
  windows-contract:
    name: Windows non-mutating contract
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install package dependencies
        run: npm ci --ignore-scripts

      - name: Parse PowerShell and verify browser data handling
        shell: powershell
        run: .\tests\windows-contract.ps1

      - name: Run Windows installer contracts
        run: node --test tests/windows-onboarding.test.js tests/windows-platform.test.js tests/platform-installer.test.js

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
