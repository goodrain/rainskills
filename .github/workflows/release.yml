name: Release to TOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve commit metadata
        id: meta
        run: |
          SHA="$(git rev-parse --short HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Pack release tarball
        run: |
          SHA="${{ steps.meta.outputs.sha }}"
          git archive --format=tar.gz --prefix=rainskills/ -o rainskills-latest.tar.gz HEAD
          cp rainskills-latest.tar.gz "rainskills-${SHA}.tar.gz"
          ls -lh rainskills-*.tar.gz

      - name: Install tosutil
        env:
          TOSUTIL_VERSION: v4.1.2
        run: |
          curl -fsSL "https://github.com/volcengine/tosutil/releases/download/${TOSUTIL_VERSION}/tosutil-linux-amd64.zip" \
            -o /tmp/tosutil.zip
          unzip -q /tmp/tosutil.zip -d /tmp/tosutil-pkg
          TOSUTIL_BIN="$(find /tmp/tosutil-pkg -type f -name tosutil | head -1)"
          if [[ -z "$TOSUTIL_BIN" ]]; then
            echo "tosutil binary not found in release zip; contents were:" >&2
            ls -laR /tmp/tosutil-pkg >&2
            exit 1
          fi
          chmod +x "$TOSUTIL_BIN"
          cp "$TOSUTIL_BIN" /tmp/tosutil
          /tmp/tosutil version || true

      - name: Upload to TOS
        env:
          TOS_ENDPOINT: ${{ secrets.TOS_ENDPOINT }}
          TOS_REGION: ${{ secrets.TOS_REGION }}
          TOS_BUCKET: ${{ secrets.TOS_BUCKET }}
          TOS_ACCESS_KEY_ID: ${{ secrets.TOS_ACCESS_KEY_ID }}
          TOS_ACCESS_KEY_SECRET: ${{ secrets.TOS_ACCESS_KEY_SECRET }}
          TOS_PREFIX: ${{ secrets.TOS_PREFIX }}
        run: |
          SHA="${{ steps.meta.outputs.sha }}"
          for v in TOS_ENDPOINT TOS_REGION TOS_BUCKET TOS_ACCESS_KEY_ID TOS_ACCESS_KEY_SECRET; do
            if [[ -z "${!v}" ]]; then
              echo "error: secret $v is not configured on this repo" >&2
              exit 1
            fi
          done
          PREFIX="${TOS_PREFIX:-rainskills}"
          PREFIX="${PREFIX%/}/"
          # tosutil flags use the form `-flag=value`, not `-flag value`,
          # and global creds/endpoint flags follow the positional args on the cp command.
          TOSUTIL_OPTS=(
            "-e=${TOS_ENDPOINT}"
            "-re=${TOS_REGION}"
            "-i=${TOS_ACCESS_KEY_ID}"
            "-k=${TOS_ACCESS_KEY_SECRET}"
          )

          /tmp/tosutil cp install.sh                 "tos://${TOS_BUCKET}/${PREFIX}install.sh"                 "${TOSUTIL_OPTS[@]}"
          /tmp/tosutil cp rainskills-latest.tar.gz   "tos://${TOS_BUCKET}/${PREFIX}rainskills-latest.tar.gz"   "${TOSUTIL_OPTS[@]}"
          /tmp/tosutil cp "rainskills-${SHA}.tar.gz" "tos://${TOS_BUCKET}/${PREFIX}rainskills-${SHA}.tar.gz"   "${TOSUTIL_OPTS[@]}"

      - name: Summary
        run: |
          SHA="${{ steps.meta.outputs.sha }}"
          PREFIX="${{ secrets.TOS_PREFIX }}"
          PREFIX="${PREFIX:-rainskills}"
          PREFIX="${PREFIX%/}/"
          BUCKET="${{ secrets.TOS_BUCKET }}"
          {
            echo "Released commit ${SHA}"
            echo ""
            echo "TOS objects updated under \`tos://${BUCKET}/${PREFIX}\`:"
            echo "- install.sh"
            echo "- rainskills-latest.tar.gz"
            echo "- rainskills-${SHA}.tar.gz"
          } >> "$GITHUB_STEP_SUMMARY"
