cases:
  - id: generic_deploy_current_project
    prompt: 帮我把当前项目部署到 Rainbond 上
    expected_skill: rainbond-app-assistant
  - id: generic_run_current_project
    prompt: 帮我把这个项目跑起来
    expected_skill: rainbond-app-assistant
  - id: generic_check_blocker
    prompt: 帮我看看当前项目卡在哪
    expected_skill: rainbond-app-assistant
  - id: generic_init_then_continue
    prompt: 如果还没初始化就先初始化，然后自动继续到应该停止的位置
    expected_skill: rainbond-app-assistant
  - id: explicit_bootstrap_only
    prompt: 只帮我创建应用和组件，不要继续排障
    expected_skill: rainbond-fullstack-bootstrap
  - id: explicit_troubleshoot_build_failure
    prompt: 只帮我看看 backend 为什么构建失败，先查事件和构建日志
    expected_skill: rainbond-fullstack-troubleshooter
  - id: explicit_delivery_verification
    prompt: 只帮我确认当前应用是否已经交付成功，并给我访问地址
    expected_skill: rainbond-delivery-verifier

required_markers:
  rainbond-app-assistant:
    - "default top-level owner for generic current-project"
    - "the request should start here"
    - "Concise delivery report mode"
    - "do not expose the fenced YAML block"
  rainbond-fullstack-bootstrap:
    - "Do not use as the first or default response to a generic current-project deployment request"
    - "route that to `rainbond-app-assistant`"
  rainbond-fullstack-troubleshooter:
    - "Do not use as the first or default response to a generic current-project deployment request"
    - "route that to `rainbond-app-assistant`"
  rainbond-delivery-verifier:
    - "Do not use as the first or default response to a generic current-project deployment request"
    - "route that to `rainbond-app-assistant`"

transport_cases:
  - id: mcp_success
    expected_state: mcp
    required_markers:
      policy: [current_session_has_any_rainbond_tool, "transport = mcp"]
  - id: mcp_401
    expected_state: mcp
    required_markers:
      policy: ["401 / 403 / token expired", 保持原传输]
  - id: mcp_timeout
    expected_state: mcp
    required_markers:
      policy: [写操作网络错误、超时或响应解析失败, outcome_unknown, same transport]
  - id: mcp_required_tool_missing
    expected_state: mcp
    required_markers:
      policy: [required Tool is absent, 不得改走 API 绕过]
  - id: missing_mcp_api_success
    expected_state: api
    required_markers:
      policy: [run bridge status exactly once, "transport = api if status succeeds"]
  - id: missing_both
    expected_state: unavailable
    required_markers:
      policy: ["transport = api if status succeeds else unavailable", "失败后锁定 `unavailable` 并停止"]
  - id: api_401
    expected_state: api
    required_markers:
      policy: [刷新 JWT, 不自动重放写操作]
  - id: api_endpoint_404
    expected_state: unavailable
    required_markers:
      policy: [API Endpoint 404, "不得回退到通用 `/console/mcp/query`"]
  - id: api_schema_drift
    expected_state: api
    required_markers:
      policy: [参数校验失败或 Schema 漂移, "`describe` 一次并修正输入"]
  - id: api_unknown_write_outcome
    expected_state: api
    required_markers:
      policy: [不重复原 Tool，不切换传输, same transport]
      app-assistant: [API 传输会话按下表的已安装相对路径直接读取一次, 未加载时禁止执行该阶段写操作]

forbidden_operational_markers:
  - MCP 不可用，无法完成 online verification
  - runtime truth from MCP only
  - "Rainbond MCP: the only valid source"
  - Query Rainbond MCP
  - trust MCP and report
  - executed through MCP
  - confirmed through MCP
  - if MCP is unavailable
  - MCP runtime facts later conflict
  - MCP data first
  - 通过 MCP 查找或创建
  - 任何 MCP 写工具
  - 下一个 MCP 写调用
