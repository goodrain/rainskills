cases:
  - id: generic_deploy_current_project
    prompt: 帮我把当前项目部署到 Rainbond 上
    expected_skill: rainbond-app-assistant
  - id: generic_run_current_project
    prompt: 帮我把这个项目跑起来
    expected_skill: rainbond-app-assistant
  - id: generic_check_blocker
    prompt: 帮我看看当前项目卡在哪
    expected_skill: rainbond-app-assistant
  - id: generic_init_then_continue
    prompt: 如果还没初始化就先初始化，然后自动继续到应该停止的位置
    expected_skill: rainbond-app-assistant
  - id: ambiguous_app_action
    prompt: 帮我处理一下这个应用
    expected_skill: rainbond-app-assistant
  - id: explicit_bootstrap_only
    prompt: 只帮我创建应用和组件，不要继续排障
    expected_skill: rainbond-fullstack-bootstrap
  - id: explicit_troubleshoot_build_failure
    prompt: 只帮我看看 backend 为什么构建失败，先查事件和构建日志
    expected_skill: rainbond-fullstack-troubleshooter
  - id: explicit_delivery_verification
    prompt: 只帮我确认当前应用是否已经交付成功，并给我访问地址
    expected_skill: rainbond-delivery-verifier
  - id: current_enterprise_query
    prompt: 帮我查询当前企业的信息
    expected_skill: rainbond-platform-query
  - id: current_user_query
    prompt: 查询我当前登录的用户信息
    expected_skill: rainbond-platform-query
  - id: team_query
    prompt: 查询我有哪些团队
    expected_skill: rainbond-platform-query
  - id: region_query
    prompt: 查询当前企业有哪些集群
    expected_skill: rainbond-platform-query
  - id: app_query
    prompt: 查询团队里的应用
    expected_skill: rainbond-platform-query
  - id: component_query
    prompt: 查询这个应用有哪些组件
    expected_skill: rainbond-platform-query
  - id: explicit_create_snapshot
    prompt: 为这个已有应用创建快照
    expected_skill: rainbond-app-version-assistant
  - id: explicit_sync_environment
    prompt: 同步生产环境配置到本地
    expected_skill: rainbond-env-sync
  - id: explicit_project_init
    prompt: 只初始化当前项目并生成 rainbond.app.json
    expected_skill: rainbond-project-init
  - id: explicit_template_install
    prompt: 从模板安装 WordPress 应用
    expected_skill: rainbond-template-installer
  - id: open_source_descriptor_deploy
    prompt: 按这个 docker-compose 部署 Harbor 到 Rainbond
    expected_skill: rainbond-opensource-app-deploy
  - id: open_source_name_only_uses_generic_entrypoint
    prompt: 帮我部署一个开源 Harbor
    expected_skill: rainbond-app-assistant

required_markers:
  rainbond-app-assistant:
    - "default top-level owner for generic current-project"
    - "the request should start here"
    - "Concise delivery report mode"
    - "do not expose the fenced YAML block"
    - "部署新应用还是管理已有应用"
    - "确认前不连接运行环境"
    - "1) 云端环境（免费体验）"
    - "2) 私有环境（去对接）"
    - "请选择部署位置："
    - "1、部署到本机"
    - "2、部署到独立服务器"
    - "3、部署到已有 Rainbond"
    - "rainskills_operation_id"
  rainbond-fullstack-bootstrap:
    - "Do not use for a generic current-project deployment request"
    - "route that to `rainbond-app-assistant`"
    - "1) 云端环境（免费体验）"
    - "2) 私有环境（去对接）"
    - "请选择部署位置："
    - "1、部署到本机"
    - "2、部署到独立服务器"
    - "3、部署到已有 Rainbond"
  rainbond-fullstack-troubleshooter:
    - "Do not use for a generic current-project deployment request"
    - "route that to `rainbond-app-assistant`"
    - "只让用户选择 `Rainbond Cloud` 或承载目标应用的`已有私有 Rainbond`"
  rainbond-delivery-verifier:
    - "Do not use for a generic current-project deployment request"
    - "route that to `rainbond-app-assistant`"
    - "只让用户选择 `Rainbond Cloud` 或承载目标应用的`已有私有 Rainbond`"
  rainbond-platform-query:
