    - "1) 云端环境（免费体验）"
    - "2) 私有环境（去对接）"
    - "请选择部署位置："
    - "1、部署到本机"
    - "2、部署到独立服务器"
    - "3、部署到已有 Rainbond"
  rainbond-template-installer:
    - "<!-- rainskills-runtime-gate:start -->"
    - "1) 云端环境（免费体验）"
    - "2) 私有环境（去对接）"
    - "请选择部署位置："
    - "1、部署到本机"
    - "2、部署到独立服务器"
    - "3、部署到已有 Rainbond"
