    prompt: 只帮我排查现有应用的 api 启动失败。Pod 一直报 FailedMount，提示配置文件对应的 ConfigMap not found；组件存储摘要里确实有 config-file 卷。不要改源码，也不要无限重试，请完整输出结构化 TroubleshootResult。
