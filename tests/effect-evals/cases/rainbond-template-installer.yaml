  - id: rainbond-template-installer.02
    skill_id: rainbond-template-installer
    prompt: 从官方云市场安装 Pinpoint 到一个新应用 pinpoint-apm，版本用最新稳定版。即使同名应用已经存在，也必须新建，不要复用旧应用。
    fixture:
      kind: policy_scenario
      name: rainbond-template-installer.02
    expected_behaviors:
      - 解析云市场模板与稳定版本；重名时依次尝试 -2、-3、-4，不复用旧应用或无关应用；成功后使用新 app_id 安装并说明重命名。
    forbidden_behaviors:
      - Do not reuse a forbidden target app, guess a template/version, or route template installation through bootstrap.
    routing:
