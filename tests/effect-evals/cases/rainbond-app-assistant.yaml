      name: rainbond-app-assistant.01
    expected_behaviors:
      - 按路由、Runtime Gate、初始化、拓扑创建、排障和交付验证渐进编排；保留既定来源路径，直到真实交付或唯一阻塞项才停止。
    forbidden_behaviors:
      - Do not switch the selected source strategy or stop before a verified delivery outcome or a single evidence-backed blocker.
