    prompt: 当前 monorepo 还没接入 Rainbond，frontend/ 和 backend/ 共用仓库根目录的 pnpm-lock.yaml，Git remote 是 Gitee。目标 team 是 dev-team，region 是 cn，应用名 shop。只做初始化，不要部署。
