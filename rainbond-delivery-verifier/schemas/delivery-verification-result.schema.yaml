# Frozen source of truth for the current delivery-verifier structured output contract.
# This contract is intentionally narrow: final delivery acceptance only.

$schema: "https://json-schema.org/draft/2020-12/schema"
title: DeliveryVerificationResult
type: object
additionalProperties: false
required:
  - DeliveryVerificationResult
$defs:
  non_empty_string:
    type: string
    minLength: 1
  runtime_state:
    type: string
    enum:
      - topology_missing
      - topology_building
      - runtime_unhealthy
      - runtime_healthy
      - capacity_blocked
      - code_or_build_handoff_needed
  delivery_state:
    type: string
    enum:
      - delivered
      - delivered-but-needs-manual-validation
      - partially-delivered
      - blocked
  component_status:
    type: string
    enum:
      - building
      - waiting
      - running
      - abnormal
      - capacity-blocked
  verification_mode:
    type: string
    enum:
      - verified
      - inferred
      - manual_validation_needed
  next_action:
    type: string
    enum:
      - stop
      - manual_url_validation
      - run_troubleshooter
      - fix_cluster_capacity_first
      - code_build_handoff
  probe_check:
    type: object
    additionalProperties: false
    required:
      - name
      - status
    properties:
      name:
        enum:
          - critical_components
          - root
          - same_host_api
          - static_asset
          - deep_link
          - mime
      status:
        enum:
          - verified
          - not_applicable
          - manual_validation_needed
          - failed
  probe_evidence:
    type: object
    additionalProperties: false
    required:
      - policy_version
      - status
      - checks
      - persistence
    properties:
      policy_version:
        const: rainskills.delivery-probe-policy.v1
      status:
        enum:
          - verified
          - manual_validation_required
          - rejected
          - failed
      checks:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/probe_check"
      persistence:
        type: object
        additionalProperties: false
        required:
          - status
          - caveat
        properties:
          status:
            enum:
              - verified
              - not_applicable
              - missing
              - unverified
          caveat:
            anyOf:
              - $ref: "#/$defs/non_empty_string"
              - type: "null"
properties:
  DeliveryVerificationResult:
    type: object
    additionalProperties: false
    required:
      - runtime_state
      - delivery_state
      - preferred_access_url
      - verification_mode
      - blocker
      - probe_evidence
      - next_action
      - component_status
    properties:
      runtime_state:
        $ref: "#/$defs/runtime_state"
      delivery_state:
        $ref: "#/$defs/delivery_state"
      preferred_access_url:
        anyOf:
          - $ref: "#/$defs/non_empty_string"
          - type: "null"
      verification_mode:
        $ref: "#/$defs/verification_mode"
      blocker:
        anyOf:
          - $ref: "#/$defs/non_empty_string"
          - type: "null"
      probe_evidence:
        anyOf:
          - $ref: "#/$defs/probe_evidence"
          - type: "null"
      next_action:
        $ref: "#/$defs/next_action"
      component_status:
        type: object
        additionalProperties:
          $ref: "#/$defs/component_status"
