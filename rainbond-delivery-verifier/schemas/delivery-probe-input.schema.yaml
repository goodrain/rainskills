$schema: https://json-schema.org/draft/2020-12/schema
title: DeliveryProbeInput
type: object
additionalProperties: false
required:
  - policy_version
  - url
  - method
properties:
  policy_version:
    const: rainskills.delivery-probe-policy.v1
  url:
    type: string
    minLength: 1
    maxLength: 4096
  method:
    type: string
    enum:
      - HEAD
      - GET
